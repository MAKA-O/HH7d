    />
    <title>Тренажёр собеседований</title>
    <script>
      // Светлая тема — по умолчанию. Тёмная применяется до первой отрисовки,
      // только если пользователь явно выбрал её (или режим «как в системе»).
      (function () {
        try {
          var stored = localStorage.getItem('iq-theme')
          var dark =
            stored === 'dark' ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (error) {
          /* приватный режим — остаёмся на светлой теме */
        }
      })()
    </script>
